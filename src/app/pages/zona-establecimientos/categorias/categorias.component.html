<!-- Esqueleton mientras cargan las opciones y los comercios -->
<div class="sk-wrap p-2" *ngIf="loaderPage">
    <div class="sk-chips">
        <span class="sk-block sk-chip" *ngFor="let n of skeletonChips"></span>
    </div>
    <div class="sk-grid">
        <div class="sk-card" *ngFor="let n of skeletonCards">
            <div class="sk-inner">
                <div class="sk-block sk-portada"></div>
                <div class="sk-body">
                    <div class="sk-block sk-linea sk-l1"></div>
                    <div class="sk-block sk-linea sk-l2"></div>
                    <div class="sk-block sk-linea sk-l3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="animated fadeInUp">

    
    <div *ngIf="isNullselectedDireccion" class="div-img-gps p-3" (click)="openDialogDireccion()">
        <img src="assets/images/_establesca_direccion.png" alt="direccione">
        <p class="pt-2">Para comenzar, establesca una dirección de entrega.</p>
    </div>
    
    <div *ngIf="!loaderPage && listEstablecimientos && listEstablecimientos.length === 0" class="div-img-gps p-3">
        <img src="assets/images/_no_disponible.png" alt="no-disponible">
        <p class="pt-2">El servicio aún no esta disponible en este lugar.</p>
    </div>
    


    <!-- PROMOCIONES -->    
    <div class="p-2 div-promo-content border-bottom" *ngIf="listPromociones.length > 0">
        <p class="fw-600 pl-2 m-0">Promociones</p>
        <app-comp-view-promo [list]="listPromociones" (itemSelected)="itemSelected($event)"></app-comp-view-promo>
    </div>    
    <!-- PROMOCIONES -->

    <div class="p-2 content-master-establecimiento" *ngIf="listEstablecimientos && !loaderPage">

        <!-- filtro de categorias. Los dos estados (pastillas / buscador) se apilan
             en el mismo lugar con una altura reservada, asi el cambio es un
             crossfade suave y la grilla de abajo no salta. -->
        <div class="barra-filtro">
            <ng-container *ngIf="isShowTextBusquedaComercio; else elseTemplateBusquedaClic">
                <!-- busca por descripcion de categoria o nombre comercio  -->
                <mat-form-field class="pl-3 pr-3 text-search-comercio" [@cambioBusqueda]>
                    <input matInput placeholder="Buscar por nombre del comercio" value="" autocomplete="off" name="comercio_buscar_nombre" (keyup)="searchByNomComercio(textSearhComercio.value)" #textSearhComercio>
                    <button matSuffix class="btn btn-sm" aria-label="Clear" (click)="clearTextBusquedaComercio()">
                        <i class="fa fa-close"></i>
                    </button>
                </mat-form-field>
            </ng-container>
            <ng-template #elseTemplateBusquedaClic>
                <!-- busca por clic en filtros -->
                <div class="scrolling-wrapper p-2 border-bottom content-categoria-filtro" *ngIf="listSubCatFiltros.length > 1" [@cambioBusqueda]>
                    <div class="btn-link-cat-filtro" *ngFor="let item of listSubCatFiltros" [ngClass]="{'active': item.selected}" (click)="aplicarFitroSubCategoria(item)">
                        <ng-container *ngIf="item.descripcion == 'buscar'; else elseFilterDescription">
                            <i class="fa fa-search" title="Buscar" (click)="showTextBusquedaComercio()"></i>
                        </ng-container>
                        <ng-template #elseFilterDescription>
                            <span class="text-secondary">{{item.descripcion}}</span>
                        </ng-template>
                    </div>
                </div>
            </ng-template>
        </div>


        <!-- Isotope filtra y reacomoda. Se renderizan TODAS las tarjetas siempre,
             cada celda marcada con sus categorias (cat-<id>) y el nombre para la
             busqueda; Isotope oculta las que no aplican y desliza las demas a su
             nueva posicion. -->
        <div class="content-all-comercio" #gridComercios>
            <div class="celda-comercio" *ngFor="let item of listEstablecimientos"
                 [ngClass]="clasesFiltro(item)" [attr.data-nombre]="(item.nombre || '') | lowercase">
                <app-item-comercio [itemEstablecimiento]="item" (itemSelected)="itemSelected($event)"></app-item-comercio>
            </div>
        </div>
        <br><br>
        
    </div>
</div>

<div class="border mapa-solo">
  <google-map *ngIf="puedeMontarMapa()" [hidden]="mostrarRespaldo()"
              height="230px" width="100%" [center]="center" [zoom]="zoom" [options]="options"
              (mapInitialized)="mapaMontado()" (tilesloaded)="mapaListo()">
    <map-marker *ngIf="posCliente" [position]="posCliente" [options]="opcionesCliente"></map-marker>
    <map-marker *ngIf="posRepartidor" [position]="posRepartidor" [options]="opcionesRepartidor"></map-marker>
  </google-map>
  <div *ngIf="mostrarRespaldo()" class="sin-mapa">Mapa no disponible por el momento.</div>
</div>

<div class="p-4">
    <div>
        <p class="fs-18 fw-600"><i class="fa fa-arrow-left pr-2" (click)="cerrarDlg()"></i> Número de celular <i class="fa fa-phone ml-2"></i></p>
    </div>

    <mat-form-field class="w-100">        
        <input 
        class="input-headline"
        matInput        
        type="tel"
        placeholder="Telefono"
        (keyup) = "verificarNum(telefono.value)" 
        [value] = "data.numberphone" autocomplete="off"
        maxlength="9"        
        #telefono required>
        <mat-hint align="end">{{telefono.value.length}} / 9</mat-hint>
    </mat-form-field>
    <br>

    <p class="fs-12 text-secondary">
        <i class="fa fa-info-circle text-info mr-1"></i>
        Asegúrese de ingresar su número correctamente, será usado para contactarlo sobre su pedido.
    </p>

    <button 
        mat-flat-button color="primary"
        class="w-100 mt-2"
        [disabled]="!isValidForm"
        (click)="confirmarTelefono()"
    >
        <i class="fa fa-check mr-1"></i> Confirmar número
    </button>

</div>
